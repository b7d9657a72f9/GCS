<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Gaming Control System - Window System</title>
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<link rel="icon" href="/GCS/favicon.ico">
	<link rel="stylesheet" href="/GCS/style/ws.css">
	<script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
	<script src="/GCS/script/theme.js"></script>
</head>
<body>
	<div id="nav">
		<button id="run">Run</button>
		<button id="links">Links</button>
		<button id="settings">Settings</button>
	</div>
	<script src="/GCS/script/ws.js"></script>
	<script>
		document.getElementById('run').addEventListener('click', () => {
			let app = prompt('App to run:');
			createWSWindow(`/app/${app}/index.html`, app, 500, 500, 50, 50);
		});

		document.getElementById('settings').addEventListener('click', () => {
			createWSWindow('/app/settings/index.html', 'Settings', 500, 500, 50, 50);
		});

		document.getElementById('links').addEventListener('click', () => {
			createWSWindow('/app/links/index.html', 'Links', 500, 500, 50, 50);
		});

		if (localStorage.getItem('WS-password') === null || localStorage.getItem('WS-password') === '') {
			createWSWindow('/app/settings/index.html', 'Settings', 500, 500, 50, 50);
		}
	</script>
</body>
</html>
